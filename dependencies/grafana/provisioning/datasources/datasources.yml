apiVersion: 1
datasources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki:3100
      isDefault: false

    - name: Tempo
      type: tempo
      access: proxy
      url: http://tempo:3200
      jsonData:
          httpMethod: POST
          tracesToLogsV2:
              datasourceUid: "loki"
              spanStartTimeShift: "5m"
              spanEndTimeShift: "5m"
              tags: ["job", "level"]
              mappedTags: [{ key: "service.name", value: "job" }]
              mapTagNamesEnabled: true
