services:
    loki:
        image: grafana/loki:2.9.0
        container_name: loki
        ports:
            - "3100:3100"
        command: -config.file=/etc/loki/local-config.yml
        volumes:
            - ./dependencies/loki-config.yml:/etc/loki/local-config.yml
        networks:
            - meli-network

    promtail:
        image: grafana/promtail:2.9.4
        container_name: promtail
        volumes:
            - /var/log:/var/log
            - /home/docker/containers:/var/lib/docker/containers:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - ./dependencies/promtail-config.yml:/etc/promtail/config.yml
            - /etc/machine-id:/etc/machine-id:ro
        command: -config.file=/etc/promtail/config.yml
        depends_on:
            - loki
        networks:
            - meli-network

    tempo:
        image: grafana/tempo:2.3.0
        container_name: tempo
        ports:
            - "3200:3200"
            - "4317:4317"
            - "4318:4318"
        command: ["-config.file=/etc/tempo.yml"]
        volumes:
            - ./dependencies/tempo-config.yml:/etc/tempo.yml
            - tempo_data:/tmp/tempo
        networks:
            - meli-network

    grafana:
        image: grafana/grafana:latest
        container_name: grafana
        volumes:
            - grafana_data:/var/lib/grafana
            - ./dependencies/grafana/provisioning:/etc/grafana/provisioning
        ports:
            - 3300:3000
        depends_on:
            - loki
            - tempo
        networks:
            - meli-network

networks:
    meli-network:
        external: true

volumes:
    grafana_data:
    tempo_data:
