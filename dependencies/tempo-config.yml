server:
    http_listen_port: 3200
    grpc_listen_port: 9095

distributor:
    receivers:
        otlp:
            protocols:
                grpc:
                    endpoint: "0.0.0.0:4317"
                http:
                    endpoint: "0.0.0.0:4318"

ingester:
    max_block_duration: 5m

compactor:
    compaction:
        block_retention: 1h

storage:
    trace:
        backend: local
        local:
            path: /tmp/tempo/blocks

metrics_generator:
    registry:
        external_labels:
            source: tempo
            cluster: docker-compose
    storage:
        path: /tmp/tempo/generator/wal

overrides:
    defaults:
        metrics_generator:
            processors: [service-graphs, span-metrics]
